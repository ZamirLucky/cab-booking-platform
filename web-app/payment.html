<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cab Booking — Payment</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-light">

  <!-- Navbar (shared across all protected pages) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">🚕 Cab Booking</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#main-nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <!-- Nav links left-aligned (me-auto); logout right -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="bookings.html">Bookings</a></li>
          <li class="nav-item"><a class="nav-link active" href="payment.html">Payment</a></li>
          <li class="nav-item"><a class="nav-link" href="locations.html">Locations</a></li>
          <li class="nav-item"><a class="nav-link" href="notifications.html">Inbox</a></li>
        </ul>
        <button class="btn btn-outline-light btn-sm" onclick="handleLogout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 680px;">

    <h2 class="mb-4">Payment</h2>

    <!-- Global error alert -->
    <div id="pay-error" class="alert alert-danger d-none" role="alert"></div>

    <!-- Pay panel: shown when a booking_id is known but not yet paid -->
    <div id="pay-panel" class="d-none mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white fw-semibold">Confirm Payment</div>
        <div class="card-body">
          <p class="mb-1">
            <span class="text-muted">Booking ID:</span>
            <!-- Pre-filled from URL ?id= param -->
            <code id="pay-booking-id" class="user-select-all"></code>
          </p>
          <p class="text-muted small mt-2">
            The fare will be calculated using the multipliers for your cab type,
            passenger count, and any available loyalty discount.
          </p>
          <!-- Pay button: disabled during processing -->
          <button id="pay-btn" class="btn btn-success">Pay Now</button>
        </div>
      </div>
    </div>

    <!-- Lookup panel: shown when no ?id= is in the URL.
         Fetches the user's current bookings so they can pick one — no UUID needed. -->
    <div id="lookup-panel" class="d-none mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white fw-semibold">Select a Booking to Pay</div>
        <div class="card-body p-0">
          <div id="bookings-for-payment" class="p-3">
            <p class="text-muted mb-0">Loading your bookings…</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment summary: shown after POST /api/payments or when booking is already paid -->
    <div id="payment-summary" class="d-none"></div>

  </div><!-- /container -->

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/payment.js"></script>
  <script>
    // Format ISO datetime → human-readable (duplicated from bookings.js because
    // payment.html does not load bookings.js).
    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      guardPage();

      // Read optional ?id= param passed from bookings.html Pay link
      const bookingId = new URLSearchParams(window.location.search).get('id');

      if (bookingId) {
        await initWithBookingId(bookingId);
      } else {
        // No URL param — show the user's current bookings so they can pick one.
        // They should never need to paste a UUID.
        document.getElementById('lookup-panel').classList.remove('d-none');
        await loadBookingsForPayment();
      }
    });

    // Fetch current bookings and render a selectable list.
    async function loadBookingsForPayment() {
      const container = document.getElementById('bookings-for-payment');
      try {
        const res  = await fetch(`${GATEWAY_URL}/api/bookings/current`, { headers: authHeaders() });
        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = `<p class="text-danger mb-0">${data.error || 'Failed to load bookings.'}</p>`;
          return;
        }

        if (!data.length) {
          container.innerHTML = `
            <p class="text-muted mb-0">
              No current bookings found.
              <a href="bookings.html">Create a booking first.</a>
            </p>`;
          return;
        }

        // Render a row per booking — user picks one to pay for.
        container.innerHTML = data.map(b => `
          <div class="d-flex justify-content-between align-items-center
                      border-bottom px-3 py-2">
            <div>
              <span class="fw-semibold">${b.start_location}</span>
              <span class="text-muted mx-1">→</span>
              <span class="fw-semibold">${b.end_location}</span>
              <span class="text-muted ms-2 small">${fmtDate(b.booking_datetime)}</span>
              <span class="text-muted ms-2 small">${b.cab_type} · ${b.passengers} pax</span>
            </div>
            <button class="btn btn-success btn-sm ms-3 flex-shrink-0"
                    onclick="selectBooking('${b.id}')">
              Pay
            </button>
          </div>`).join('');
      } catch {
        container.innerHTML = `<p class="text-danger mb-0">Cannot reach the server. Make sure all services are running.</p>`;
      }
    }

    // Called when the user clicks Pay on a booking row in the selector.
    async function selectBooking(bookingId) {
      document.getElementById('lookup-panel').classList.add('d-none');
      await initWithBookingId(bookingId);
    }

    // Initialise page for a known booking ID
    // Checks for an existing payment first; shows Pay panel if not yet paid.
    async function initWithBookingId(bookingId) {
      const payError = document.getElementById('pay-error');
      payError.classList.add('d-none');

      try {
        const existing = await loadPayment(bookingId);

        if (existing) {
          // Already paid — show summary only, no action needed
          renderPaymentSummary(existing);
        } else {
          // Not yet paid — show confirm panel with booking ID
          document.getElementById('pay-booking-id').textContent = bookingId;
          document.getElementById('pay-panel').classList.remove('d-none');

          document.getElementById('pay-btn').addEventListener('click', () => processPayment(bookingId));
        }
      } catch (err) {
        payError.textContent = err.message || 'Could not load payment details.';
        payError.classList.remove('d-none');
      }
    }

    // Process a new payment
    // Calls submitPayment(), hides the pay panel, and renders the breakdown on success.
    async function processPayment(bookingId) {
      const payError = document.getElementById('pay-error');
      const payBtn   = document.getElementById('pay-btn');
      payError.classList.add('d-none');

      // Disable button to prevent double-submission
      payBtn.disabled    = true;
      payBtn.textContent = 'Processing…';

      try {
        const res  = await submitPayment(bookingId);
        const data = await res.json();

        if (!res.ok) {
          payError.textContent = data.error || 'Payment failed. Please try again.';
          payError.classList.remove('d-none');
          payBtn.disabled    = false;
          payBtn.textContent = 'Pay Now';
          return;
        }

        // Success: hide pay panel and display confirmed summary
        document.getElementById('pay-panel').classList.add('d-none');
        renderPaymentSummary(data);
      } catch {
        payError.textContent = 'Cannot reach the server.';
        payError.classList.remove('d-none');
        payBtn.disabled    = false;
        payBtn.textContent = 'Pay Now';
      }
    }

    // Note: manual UUID lookup form removed.
    // Payment is initiated either via the Pay button on bookings.html
    // (?id= URL param) or by selecting a booking from the list above.
  </script>
</body>
</html>
